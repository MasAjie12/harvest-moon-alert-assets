<div class="hm-card">
    <img class="hm-bg" src="https://raw.githubusercontent.com/MasAjie12/harvest-moon-alert-assets/main/bg.png" alt="">
    <div class="hm-veil"></div>
    <div class="hm-star hm-star-one">✦</div><div class="hm-star hm-star-two">✧</div><div class="hm-star hm-star-three">✦</div><div class="hm-star hm-star-four">✧</div><div class="hm-leaf hm-leaf-left">❋</div><div class="hm-leaf hm-leaf-right">❋</div>
    <div class="hm-token-stack">
        <div class="hm-panel-amount"><div class="hm-amount">{amount}</div></div>
        <div class="hm-from">{from_text}</div>
        <div class="hm-info">
            <div class="hm-who">{supporter}</div>
            <div class="hm-msg">{message}</div>
        </div>
    </div>
    <img class="hm-side hm-left" src="https://raw.githubusercontent.com/MasAjie12/harvest-moon-alert-assets/main/baru.png" alt=""><img class="hm-side hm-right" src="https://raw.githubusercontent.com/MasAjie12/harvest-moon-alert-assets/main/baru-right.png" alt="">
</div>
